<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'"><title>Connection settings</title><link rel="stylesheet" href="settings.css"></head>
<body><main><p class="eyebrow">CODEX SSH DESKTOP</p><h1>Connect to your Mac.</h1><p class="intro">Use an existing SSH alias. Your Codex account and work stay on the remote computer.</p>
<form id="connection"><label for="sshHost">SSH host</label><input id="sshHost" name="sshHost" placeholder="studio" required autocomplete="off" spellcheck="false"><p class="hint">The same alias you use with <code>ssh studio</code>.</p>
<details><summary>Advanced connection settings</summary><label for="remoteDirectory">Remote installation directory</label><input id="remoteDirectory" name="remoteDirectory" spellcheck="false"><label for="remoteNode">Remote Node executable</label><input id="remoteNode" name="remoteNode" spellcheck="false"></details>
<p id="error" role="alert"></p><button id="save" type="submit">Save and connect <span aria-hidden="true">→</span></button></form>
<p class="footer">Run the remote setup steps in the README before connecting.</p></main><script src="settings.js"></script></body></html>
